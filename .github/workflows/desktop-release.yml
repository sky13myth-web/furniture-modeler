name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v2.1.0)
        required: true
        default: v2.1.0
      publish:
        description: Upload the installer and checksum to this GitHub release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.tools\electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.tools\electron-builder-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify requested release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!=='v'+p.version)throw Error('Tag must match package.json version')"
      - run: npm ci --no-audit --no-fund
      - name: Ensure Electron runtime is installed
        run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run desktop:smoke
      - run: npm run dist:win
      - run: npm run desktop:verify
      - run: node scripts/desktop-smoke.mjs --packaged
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ATOLYE-Windows-${{ inputs.tag }}
          path: |
            dist/ATOLYE-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Publish installer to the selected release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Create the release before uploading installer assets.' }
          gh release upload $env:RELEASE_TAG dist/ATOLYE-Setup-*.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading installer assets failed.' }
